services:
  postgres:
    image: postgres:17-alpine
    container_name: arima-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arima}
      POSTGRES_DB: ${POSTGRES_DB:-arima}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arima} -d ${POSTGRES_DB:-arima}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
